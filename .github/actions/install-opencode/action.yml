name: install-opencode
description: Ставит OpenCode CLI с зафиксированной версией и проверкой SHA-256
inputs:
  version:
    description: Релизная версия OpenCode
    default: '1.19.6'
  sha256:
    description: SHA-256 архива opencode-linux-x64
    default: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
runs:
  using: composite
  steps:
    - name: Download, verify and unpack OpenCode
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.version }}
        OPENCODE_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/opencode.tar.gz"
        curl -fsSL --retry 2 -o "$archive" \
          "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
        echo "$OPENCODE_SHA256  $archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/opencode-bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP/opencode-bin" opencode
        echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
