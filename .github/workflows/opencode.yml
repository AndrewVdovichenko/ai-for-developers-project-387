name: opencode

on:
  # Событие может создать любой комментатор, но  job запускается только
  # для доверенных авторов (фильтр author_association в  if), код из  PR форков не
  # исполняется: checkout только базового репозитория с fetch-depth: 1.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]

permissions:
  contents: read
  # Публикация результатов агентом идёт раннеровым GITHUB_TOKEN: обработчик V1
  # не передаёт installation-токен приложения в  окружение bash-инструмента.
  # Без этого скоупа `gh issue create` отвечает 403 insufficient scope
  # (прогон 45002304360), созданные issue публикуются от  github-actions[bot].
  # Job запускается только для  доверенных авторов (фильтр author_association
  # в  if), недоверенные комментаторы до  write-скоупа не доходят.
  # jactionlint ignore=excessive-permissions
  issues: write

  # OIDC нужен стандартному режиму интеграции: обмен на  installation token
  # GitHub App opencode-agent для  ответов в  комментарии. Секреты недоступны
  # недоверенным авторам — запуск ограничен фильтром в  if.
  # jactionlint ignore=excessive-permissions
  id-token: write

jobs:
  opencode:
    # Гейт регистрозависим: команды фиксируем строчными, как в  README.
    if: |
      (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')) &&
      !endsWith(github.event.comment.user.login, '[bot]') &&
      (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opencode-issue-agent
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Обработчик github run не отвечает на  permission-запросы своей сессии,
          # а  у  агента build по  умолчанию ask внешних путей и  doom_loop:
          # не отвеченный ask висит до  timeout-minutes (прогон 44997541687).
          # deny превращает ask в  мгновенный DeniedError, агент продолжает.

          OPENCODE_CONFIG_CONTENT: '{ "permission": { "external_directory": "deny", "doom_loop": "deny" } }'
          # Явно отдаём Actions-токен gh CLI: скоуп issues: write из  блока
          # permissions выше — единственный write-ключ, доступный инструменту.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/qwen3.8-flash
          mentions: /opencode,/oc
          share: false
