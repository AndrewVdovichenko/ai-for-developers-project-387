name: opencode

on:
  # Запуск ограничен доверенными людьми, а для PR проверяется репозиторий ветки.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  # jactionlint ignore=dangerous-triggers
  pull_request_review_comment:
    types: [created]

# Имя содержит только номер PR из события, без текста комментария.
# История Actions служит счётчиком попыток, включая отменённые и Re-run.
run-name: >-
  ${{ (github.event.comment.user.type == 'User' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/oc ') || startsWith(github.event.comment.body, '/opencode ')) &&
       (github.event.pull_request.number || github.event.issue.pull_request)) &&
      format('OpenCode PR #{0}', github.event.pull_request.number || github.event.issue.number) ||
      'OpenCode issue or ignored comment' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  opencode:
    if: >-
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/oc ') || startsWith(github.event.comment.body, '/opencode '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opencode-comment-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      # Публикация тикетов из issue и итогового отчёта в PR.
      # jactionlint ignore=excessive-permissions
      issues: write
      # jactionlint ignore=excessive-permissions
      pull-requests: write
      # OIDC-обмен на токен OpenCode App для операций встроенного обработчика.
      # jactionlint ignore=excessive-permissions
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check PR branch and attempt budget
        id: budget
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$GH_REPO" '
            .state == "open" and .base.ref == "main" and
            .head.repo.full_name == $repo and .head.ref != .base.ref
          ' <<< "$pr" >/dev/null; then
            echo "reason=ineligible" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$(jq -r .head.sha <<< "$pr")" >> "$GITHUB_OUTPUT"
          runs=$(gh api --paginate --slurp "repos/$GH_REPO/actions/workflows/opencode.yml/runs?per_page=100")
          jq -e --arg name "OpenCode PR #$PR_NUMBER" --argjson id "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              [.[] | .workflow_runs[] | select(.display_title == $name)] |
              any(.id == $id and .run_attempt == $attempt)
            ' <<< "$runs" >/dev/null
          attempts=$(jq --arg name "OpenCode PR #$PR_NUMBER" '
            [.[] | .workflow_runs[] | select(.display_title == $name) | .run_attempt] | add
          ' <<< "$runs")
          echo "Attempts in history: $attempts / 3"
          if (( attempts > 3 )); then
            echo "reason=limit_exhausted" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        id: checkout
        if: steps.budget.outputs.reason == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Install OpenCode
        id: setup
        if: steps.budget.outputs.reason == ''
        run: |
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v1.19.6/opencode-linux-x64.tar.gz" -o "$RUNNER_TEMP/opencode.tar.gz"
          printf '47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057  %s\n' "$RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin" opencode
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"

      - name: Prepare App-backed PR commands for issue implementation
        if: env.PR_NUMBER == ''
        run: install -Dm755 .github/scripts/opencode-pr "$RUNNER_TEMP/opencode-bin/opencode-pr"

      - name: Run OpenCode
        id: agent
        if: steps.budget.outputs.reason == ''
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: '{ "permission": { "external_directory": "deny", "doom_loop": "deny" }, "small_model": "opencode/qwen3.8-flash" }'
          GH_TOKEN: ${{ env.PR_NUMBER == '' && github.token || '' }}
          MODEL: opencode/qwen3.8-flash
          MENTIONS: /opencode,/oc
          SHARE: 'false'
        run: |
          if [[ -z "$OPENCODE_API_KEY" ]]; then
            echo "reason=infra" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          status=0
          timeout --kill-after=15s 10m opencode github run || status=$?
          case "$status" in
            0) exit 0 ;;
            124|137) echo "reason=timeout" >> "$GITHUB_OUTPUT" ;;
            *) echo "reason=agent_failed" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$status"

      - name: Report why human action is needed
        if: always() && env.PR_NUMBER != '' && steps.budget.outputs.reason != 'ineligible' && (failure() || steps.budget.outputs.reason == 'limit_exhausted')
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.budget.outputs.reason || steps.agent.outputs.reason || 'infra' }}
          PR_SHA: ${{ steps.budget.outputs.sha }}
        run: |
          sha=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha) || sha=${PR_SHA:-unknown}
          printf 'Нужен человек · `%s`\n\nSHA: `%s`\n\n[Логи прогона](%s/%s/actions/runs/%s/attempts/%s)\n' \
            "$REASON" "$sha" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" |
            gh pr comment "$PR_NUMBER" --body-file -
