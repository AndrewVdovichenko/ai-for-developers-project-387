name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - name: Verify exact revision
        id: revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "$sha"
          test "$sha" = "$EXPECTED_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Run checks and browser tests
        id: checks
        env:
          PLAYWRIGHT_TRACE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: mise run check
      - name: Record browser verification
        if: always() && github.event_name == 'pull_request' && steps.revision.outcome == 'success'
        env:
          VERIFIED_SHA: ${{ steps.revision.outputs.sha }}
          CHECK_RESULT: ${{ steps.checks.outcome }}
        run: |
          mkdir -p test-results
          printf 'HEAD=%s\ncheck=%s\ncommand=mise run check\n' "$VERIFIED_SHA" "$CHECK_RESULT" > test-results/verification.txt
      - name: Upload browser evidence
        if: always() && github.event_name == 'pull_request' && steps.revision.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-${{ steps.revision.outputs.sha }}-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
